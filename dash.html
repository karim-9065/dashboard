

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="dash.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <aside class="menu">
        <ul>
            <li class="profile">
                <div class="img-box">
                    <img src="c:\Users\kimo\Desktop\patrick jane.jpg" alt="profile">
                </div>
                <h2>Jane Patrick</h2>
            </li>

            <li>
                <a class="active" href="#">
                    <i class="fas fa-home"></i>
                    <p>Dashboard</p>
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fas fa-user-group"></i>
                    <p>Clients</p>
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fas fa-table"></i>
                    <p>Products</p>
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fas fa-chart-pie"></i>
                    <p>Charts</p>
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fas fa-pen"></i>
                    <p>Posts</p>
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fas fa-star"></i>
                    <p>Favorite</p>
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fas fa-cog"></i>
                    <p>Settings</p>
                </a>
            </li>

            <li class="log-out">
                <a href="#">
                    <i class="fas fa-sign-out-alt"></i>
                    <p>Log Out</p>
                </a>
            </li>
        </ul>
    </aside>

    <main class="content">

        <header class="title-info">
            <p>Dashboard</p>
            <i class="fas fa-chart-bar" aria-hidden="true"></i>
        </header>

        <section class="data-info" aria-label="Dashboard statistics">

            <div class="box">
                <i class="fas fa-user" aria-hidden="true"></i>
                <div class="data">
                    <p>Users</p>
                    <span>100</span>
                </div>
            </div>

            <div class="box">
                <i class="fas fa-pen" aria-hidden="true"></i>
                <div class="data">
                    <p>Posts</p>
                    <span>765</span>
                </div>
            </div>

            <div class="box">
                <i class="fas fa-table" aria-hidden="true"></i>
                <div class="data">
                    <p>Products</p>
                    <span>345</span>
                </div>
            </div>

            <div class="box">
                <i class="fas fa-dollar-sign" aria-hidden="true"></i>
                <div class="data">
                    <p>Revenue</p>
                    <span>$12,500</span>
                </div>
            </div>

        </section>

        <header class="title-info">
            <p>Products</p>
            <i class="fas fa-table" aria-hidden="true"></i>
        </header>

        <section class="products-table">
            <table>
                <thead>
                    <tr>
                        <th scope="col">Product</th>
                        <th scope="col">Price</th>
                        <th scope="col">Count</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>TV</td>
                        <td><span class="price">$145</span></td>
                        <td><span class="count">125</span></td>
                    </tr>

                    <tr>
                        <td>Bed</td>
                        <td><span class="price">$125</span></td>
                        <td><span class="count">145</span></td>
                    </tr>

                    <tr>
                        <td>PS5</td>
                        <td><span class="price">$1,500</span></td>
                        <td><span class="count">1,250</span></td>
                    </tr>
                </tbody>
            </table>
        </section>

    </main>

</body>
</html>
